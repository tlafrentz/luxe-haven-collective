<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
<title id="title">Dynamic Pricing Operator Checklist</title>
<desc id="desc">Six questions to answer before changing a nightly rate.</desc>
<rect width="1200" height="820" rx="34" fill="#FAF8F4"/>
<text x="72" y="95" font-family="Georgia, serif" font-size="44" fill="#22201D">Before You Change the Rate</text>
<text x="72" y="140" font-family="Arial, sans-serif" font-size="21" fill="#6B655E">Use evidence first. Change deliberately. Measure what happens.</text>
<rect x="76" y="195" width="34" height="34" rx="5" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/><path d="M84 214 l9 10 l19 -23" fill="none" stroke="#146B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="220" font-family="Arial, sans-serif" font-size="28" fill="#302D29">Have I reviewed current demand?</text><rect x="76" y="285" width="34" height="34" rx="5" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/><path d="M84 304 l9 10 l19 -23" fill="none" stroke="#146B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="310" font-family="Arial, sans-serif" font-size="28" fill="#302D29">Has booking pace meaningfully changed?</text><rect x="76" y="375" width="34" height="34" rx="5" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/><path d="M84 394 l9 10 l19 -23" fill="none" stroke="#146B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="400" font-family="Arial, sans-serif" font-size="28" fill="#302D29">What evidence supports this adjustment?</text><rect x="76" y="465" width="34" height="34" rx="5" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/><path d="M84 484 l9 10 l19 -23" fill="none" stroke="#146B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="490" font-family="Arial, sans-serif" font-size="28" fill="#302D29">Does the change fit the property's positioning?</text><rect x="76" y="555" width="34" height="34" rx="5" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/><path d="M84 574 l9 10 l19 -23" fill="none" stroke="#146B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="580" font-family="Arial, sans-serif" font-size="28" fill="#302D29">Am I solving the right problem?</text><rect x="76" y="645" width="34" height="34" rx="5" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/><path d="M84 664 l9 10 l19 -23" fill="none" stroke="#146B51" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><text x="140" y="670" font-family="Arial, sans-serif" font-size="28" fill="#302D29">How and when will I measure success?</text><text x="72" y="765" font-family="Arial, sans-serif" font-weight="700" font-size="21" fill="#A6671D">LUXE HAVEN JOURNAL · REVENUE</text></svg>