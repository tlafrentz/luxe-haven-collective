<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
<title id="title">Decision Intelligence Framework</title>
<desc id="desc">Five questions that turn a metric into an operating decision.</desc>
<rect width="1200" height="720" fill="#FAF8F4"/>
<text x="600" y="68" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#24211E">From Data to Decision</text>
<text x="600" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#6B655E">A useful dashboard should answer more than what happened.</text>
<g font-family="Arial, sans-serif">
  <rect x="105" y="170" width="990" height="78" rx="18" fill="#FFFFFF" stroke="#D9D2C8"/>
  <text x="145" y="220" font-size="27" font-weight="700" fill="#146B51">1. What happened?</text>
  <text x="480" y="220" font-size="22" fill="#514C46">Identify the meaningful signal.</text>

  <rect x="105" y="270" width="990" height="78" rx="18" fill="#FFFFFF" stroke="#D9D2C8"/>
  <text x="145" y="320" font-size="27" font-weight="700" fill="#A6671D">2. Why did it happen?</text>
  <text x="510" y="320" font-size="22" fill="#514C46">Diagnose the likely cause.</text>

  <rect x="105" y="370" width="990" height="78" rx="18" fill="#FFFFFF" stroke="#D9D2C8"/>
  <text x="145" y="420" font-size="27" font-weight="700" fill="#146B51">3. What matters most?</text>
  <text x="515" y="420" font-size="22" fill="#514C46">Prioritize by impact and confidence.</text>

  <rect x="105" y="470" width="990" height="78" rx="18" fill="#FFFFFF" stroke="#D9D2C8"/>
  <text x="145" y="520" font-size="27" font-weight="700" fill="#A6671D">4. What should we do?</text>
  <text x="500" y="520" font-size="22" fill="#514C46">Choose a specific action and owner.</text>

  <rect x="105" y="570" width="990" height="78" rx="18" fill="#FFFFFF" stroke="#D9D2C8"/>
  <text x="145" y="620" font-size="27" font-weight="700" fill="#146B51">5. Did it work?</text>
  <text x="425" y="620" font-size="22" fill="#514C46">Measure the outcome and retain the learning.</text>
</g>
</svg>