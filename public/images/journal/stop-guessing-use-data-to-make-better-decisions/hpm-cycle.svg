<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
<title id="title">Hospitality Performance Management Cycle</title>
<desc id="desc">The five-stage HPM cycle: See, Understand, Decide, Execute, Learn, then repeat.</desc>
<rect width="1200" height="700" fill="#FAF8F4"/>
<text x="600" y="70" text-anchor="middle" font-family="Georgia, serif" font-size="44" fill="#24211E">The HPM Cycle</text>
<text x="600" y="110" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" fill="#6B655E">Turn signals into decisions, decisions into action, and action into learning.</text>
<circle cx="600" cy="375" r="205" fill="none" stroke="#D9D2C8" stroke-width="2"/>
<g font-family="Arial, sans-serif" text-anchor="middle">
  <circle cx="600" cy="170" r="72" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/>
  <text x="600" y="180" font-size="28" font-weight="700" fill="#146B51">SEE</text>

  <circle cx="795" cy="310" r="82" fill="#FFFFFF" stroke="#A6671D" stroke-width="3"/>
  <text x="795" y="303" font-size="25" font-weight="700" fill="#A6671D">UNDERSTAND</text>
  <text x="795" y="333" font-size="18" fill="#514C46">Why it matters</text>

  <circle cx="720" cy="545" r="72" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/>
  <text x="720" y="555" font-size="28" font-weight="700" fill="#146B51">DECIDE</text>

  <circle cx="480" cy="545" r="72" fill="#FFFFFF" stroke="#A6671D" stroke-width="3"/>
  <text x="480" y="555" font-size="27" font-weight="700" fill="#A6671D">EXECUTE</text>

  <circle cx="405" cy="310" r="72" fill="#FFFFFF" stroke="#146B51" stroke-width="3"/>
  <text x="405" y="320" font-size="28" font-weight="700" fill="#146B51">LEARN</text>
</g>
<path d="M660 185 Q760 210 770 245" fill="none" stroke="#8A837A" stroke-width="2"/>
<path d="M795 395 Q790 475 760 505" fill="none" stroke="#8A837A" stroke-width="2"/>
<path d="M648 565 Q560 590 540 566" fill="none" stroke="#8A837A" stroke-width="2"/>
<path d="M438 500 Q385 430 390 380" fill="none" stroke="#8A837A" stroke-width="2"/>
<path d="M430 245 Q500 190 540 185" fill="none" stroke="#8A837A" stroke-width="2"/>
<circle cx="600" cy="375" r="95" fill="#F2EEE8"/>
<text x="600" y="360" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#24211E">Hospitality</text>
<text x="600" y="397" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#24211E">Performance</text>
<text x="600" y="434" text-anchor="middle" font-family="Georgia, serif" font-size="28" fill="#24211E">Management</text>
</svg>