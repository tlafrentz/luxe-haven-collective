name: Vercel production deploy guard

# Vercel's GitHub integration auto-deploys every push to main and reports
# the result back as a GitHub Deployment status. Turbopack's production
# build has an intermittent, upstream bug where it fails with an ENOENT on
# .next/server/middleware.js.nft.json — unrelated to what changed in the
# push — but a clean (no-cache) rebuild reliably succeeds. This workflow
# watches for a failed *production* deployment and automatically forces
# one clean redeploy so a flaky build doesn't leave production down
# unattended.
#
# This does not create a retry loop: a `vercel deploy` run from this
# workflow calls the Vercel API directly and does not go through Vercel's
# GitHub App, so it does not itself generate a new `deployment_status`
# event for this workflow to react to.

on:
  deployment_status:

concurrency:
  group: vercel-production-guard
  cancel-in-progress: false

jobs:
  retry-on-failure:
    if: |
      github.event.deployment_status.state == 'failure' &&
      (github.event.deployment.environment == 'Production' || github.event.deployment.environment == 'production')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout failed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.deployment.sha }}

      # VERCEL_ORG_ID/VERCEL_PROJECT_ID must be the real Vercel API IDs
      # (team_xxx / prj_xxx), not the team slug shown in the dashboard URL
      # or `vercel teams ls` — the CLI silently fails to resolve the
      # project if given the slug instead of the team_xxx id.
      - name: Force a clean production redeploy
        id: redeploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: team_OwWqvrx6sYM4XxywF6nRqxru
          VERCEL_PROJECT_ID: prj_YTGVIQ11lGz57hEz4UJFX4hCnXPX
        run: npx vercel@latest deploy --prod --force --yes --token="$VERCEL_TOKEN"

      - name: Summary
        if: always()
        run: |
          echo "### Vercel production deploy guard" >> "$GITHUB_STEP_SUMMARY"
          echo "Original deployment for commit \`${{ github.event.deployment.sha }}\` failed (\`${{ github.event.deployment_status.target_url }}\`)." >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ steps.redeploy.outcome }}" = "success" ]; then
            echo "✅ Forced clean redeploy succeeded." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "❌ Forced clean redeploy FAILED — production may still be down. Check the step log above and redeploy manually." >> "$GITHUB_STEP_SUMMARY"
          fi
